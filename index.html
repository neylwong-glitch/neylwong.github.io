<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易演示网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        header {
            background: #2563eb;
            color: #fff;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 24px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .banner {
            background: #dbeafe;
            text-align: center;
            padding: 80px 20px;
        }
        .banner h1 {
            color: #1e40af;
            margin-bottom: 16px;
        }
        .banner p {
            color: #475569;
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 24px;
            transition: 0.3s;
        }
        .card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .card h3 {
            margin-bottom: 12px;
            color: #1e293b;
        }
        .card p {
            color: #64748b;
            line-height: 1.6;
        }
        footer {
            background: #0f172a;
            color: #94a3b8;
            text-align: center;
            padding: 30px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Demo站点</div>
        <nav>
            <a href="#">首页</a>
            <a href="#">产品</a>
            <a href="#">关于我们</a>
            <a href="#">联系客服</a>
        </nav>
    </header>

    <section class="banner">
        <h1>欢迎访问演示网站</h1>
        <p>这是一个简洁响应式HTML页面，支持电脑、手机浏览，你可以自由修改文字、颜色和布局。</p>
    </section>

    <div class="container">
        <div class="card">
            <h3>功能模块一</h3>
            <p>简洁页面布局，原生CSS实现，无需引入任何外部框架，打开即可运行。</p>
        </div>
        <div class="card">
            <h3>功能模块二</h3>
            <p>自适应网格布局，手机端自动换行，拥有基础hover交互效果。</p>
        </div>
        <div class="card">
            <h3>功能模块三</h3>
            <p>结构清晰，方便二次开发，你可以继续添加图片、表单、JavaScript交互。</p>
        </div>
    </div>

    <footer>
        © 2026 Demo网站 版权所有
    </footer>
</body>
</html>
